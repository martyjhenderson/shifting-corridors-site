name: Deploy Submission Worker

# The event submission Worker bundles src/shared/ (the venue list, the schema,
# the markdown serializer) and resolves js-yaml from the root node_modules, so
# a change to any of those changes what the live form does.
on:
  push:
    branches: [ main ]
    paths:
      - 'worker/**'
      - 'src/shared/**'
      - 'package-lock.json'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Submission Worker
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The live form is the only gate on untrusted input, so don't ship a
      # schema the tests reject.
      - name: Run unit tests
        run: npm test

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.133.0'
          workingDirectory: worker
          command: deploy
