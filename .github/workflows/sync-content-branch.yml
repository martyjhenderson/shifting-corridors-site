name: Sync Content Branch

# After a content PR lands on main — or after any other change does — bring
# `content` back level with main. Without this the CMS keeps editing a branch
# that drifts further behind, and every later PR carries stale diffs.
#
# `main` requires linear history, so content PRs land squashed or rebased. That
# rewrites the commits, meaning `content` is never an ancestor of main after a
# merge even though main now holds exactly its changes. So this compares trees
# rather than history: if `content` has nothing main is missing, it's safe to
# move it across whatever the commits look like.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sync:
    name: Reset content to main
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Move content to main
        run: |
          set -euo pipefail

          if ! git ls-remote --exit-code --heads origin content >/dev/null 2>&1; then
            echo "No content branch yet; creating it from main."
            git push origin "origin/main:refs/heads/content"
            exit 0
          fi

          # `content` is safe to move when it contributes nothing of its own,
          # which happens two different ways:
          #
          #   - its tree already matches main, because a squash merge rewrote
          #     the commits it did contribute; or
          #   - it adds nothing over its merge-base with main, i.e. it is simply
          #     behind after some other PR landed.
          #
          # Both need checking. Comparing only against main misreads "behind" as
          # "diverged" and strands content on a stale base — the next CMS save
          # then builds on that base and its PR proposes reverting whatever
          # landed in between. Comparing only against the merge-base misses the
          # squash case and strands it the other way.
          base=$(git merge-base origin/main origin/content)

          if ! git diff --quiet origin/main origin/content \
             && ! git diff --quiet "$base" origin/content; then
            # content holds edits main doesn't have — a Game Master saved
            # between the merge and this run. Moving the branch would discard
            # their work, so leave it for the next content PR to carry over.
            echo "::warning::content has unmerged edits - left alone." \
                 "The next content PR will bring them across."
            git diff --stat "$base" origin/content
            exit 0
          fi

          if [ "$(git rev-parse origin/content)" = "$(git rev-parse origin/main)" ]; then
            echo "content is already at main; nothing to do."
            exit 0
          fi

          # content contributes nothing of its own: either it's behind main, or
          # a squash rewrote the commits it did contribute. Either way main is
          # the branch to be on. Lease on the SHA just read, so a save landing
          # in the meantime fails the push instead of being clobbered.
          git push --force-with-lease="refs/heads/content:$(git rev-parse origin/content)" \
            origin "origin/main:refs/heads/content"
          echo "content reset to main."
